name = "arp-society-elections-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret defaults for local development. Override in `.dev.vars` locally,
# or with `wrangler secret put` / dashboard vars once deployed.
[vars]
STORAGE_BACKEND = "D1"
GAS_URL = ""
# The Vite dev server's origin — see http.ts's corsHeaders().
ALLOWED_ORIGIN = "http://localhost:5173"

# Placeholder ID — fine for local-only `wrangler dev`. Replace with a real ID
# from `wrangler d1 create election-db` before deploying to Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "election-db"
database_id = "00000000-0000-0000-0000-000000000000"

# Production config lives in wrangler.production.toml, NOT in an [env.production]
# block here — Wrangler 3.114's named-environment support has a bug where adding
# one broke the default (no --env) `wrangler dev` config resolution too (it
# suddenly reported "Missing entry-point to Worker script"). A fully separate
# config file avoids that feature entirely. See deploy-worker.yml and
# docs/CLOUDFLARE_DEPLOY.md.
